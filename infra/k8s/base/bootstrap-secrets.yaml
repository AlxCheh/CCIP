# Bootstrap secrets (postgres/redis passwords) required BEFORE Vault can inject
# anything — see notes in Task 6/8. Real values are substituted by kind-up.sh
# via `kubectl create secret --dry-run=client | kubectl apply`. This file is
# a kustomize marker only (namespace + name); the CHANGEME values never land
# in a real cluster.
apiVersion: v1
kind: Secret
metadata:
  name: ccip-bootstrap-secrets
  namespace: ccip
type: Opaque
stringData:
  postgres-password: "CHANGEME-overridden-by-kind-up.sh"
  redis-password: "CHANGEME-overridden-by-kind-up.sh"
