# Bootstrap secrets (postgres/redis/minio credentials) required BEFORE Vault can
# inject anything — see notes in Task 6/8. Shape-reference only: NOT part of
# base/kustomization.yaml resources (deliberately — kustomize builds are
# deterministic and would clobber the real secret kind-up.sh creates via
# `kubectl create secret --dry-run=client | kubectl apply` on every re-apply
# of the dev overlay, since overlays/dev includes base). kind-up.sh is the
# sole source of truth for this Secret in a real cluster.
apiVersion: v1
kind: Secret
metadata:
  name: ccip-bootstrap-secrets
  namespace: ccip
type: Opaque
stringData:
  postgres-password: "CHANGEME-overridden-by-kind-up.sh"
  redis-password: "CHANGEME-overridden-by-kind-up.sh"
  minio-user: "CHANGEME-overridden-by-kind-up.sh"
  minio-password: "CHANGEME-overridden-by-kind-up.sh"
