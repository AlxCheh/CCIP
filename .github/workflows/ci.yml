name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  audit:
    name: Zero-Drift Audit Suite
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run audit suite
        run: pnpm audit-suite

      - name: pnpm audit (npm advisories)
        run: pnpm audit --audit-level=high

      - name: Run audit lib tests
        run: pnpm test:audit

  ci:
    name: Lint · Typecheck · Prisma · Test
    needs: audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ccip_test
          POSTGRES_USER: ccip_owner
          POSTGRES_PASSWORD: ccip_test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ccip_owner -d ccip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ccip_owner:ccip_test_pass@localhost:5432/ccip_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-chars-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-chars-long

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma validate
        run: pnpm --filter @ccip/database exec prisma validate

      - name: Typecheck (all packages)
        run: pnpm turbo typecheck

      - name: Lint
        run: pnpm turbo lint

      - name: Prisma migrate deploy
        run: pnpm --filter @ccip/database run migrate:deploy

      - name: Test
        run: pnpm turbo test
        env:
          CI: true

  db-integration:
    name: DB integration (pg_partman rotation)
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4

      - name: Build ccip-postgres image
        run: docker build -t ccip-postgres-test ./infra/docker/postgres

      - name: Start postgres container
        run: |
          docker run -d --name pg \
            -e POSTGRES_DB=ccip_test \
            -e POSTGRES_USER=ccip_owner \
            -e POSTGRES_PASSWORD=ccip_test_pass \
            -p 5432:5432 \
            --health-cmd="pg_isready -U ccip_owner -d ccip_test" \
            --health-interval=5s --health-timeout=5s --health-retries=20 \
            ccip-postgres-test

      - name: Wait for postgres healthy
        run: |
          for i in $(seq 1 30); do
            s=$(docker inspect --format='{{.State.Health.Status}}' pg)
            [ "$s" = "healthy" ] && exit 0
            sleep 2
          done
          docker logs pg
          exit 1

      - uses: pnpm/action-setup@v3
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Apply Prisma migrations
        run: pnpm --filter @ccip/database migrate:deploy
        env:
          DATABASE_URL: postgresql://ccip_owner:ccip_test_pass@localhost:5432/ccip_test

      - name: Run @ccip/database integration tests
        run: pnpm --filter @ccip/database test
        env:
          DATABASE_URL: postgresql://ccip_owner:ccip_test_pass@localhost:5432/ccip_test

      - name: Postgres logs (on failure)
        if: failure()
        run: docker logs pg
