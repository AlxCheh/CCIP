# .github/workflows/api-integration.yml
name: api-integration

on:
  pull_request:
    paths:
      - 'apps/api/src/modules/**'
      - 'apps/api/test/integration/**'
      - 'apps/api/package.json'
      - 'packages/database/prisma/**'
      - '.github/workflows/api-integration.yml'
  schedule:
    - cron: '0 3 * * *'   # nightly full run
  workflow_dispatch:

jobs:
  api-integration:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL_TEST: postgresql://ccip_owner:ccip_dev_pass@localhost:5432/ccip_test
      JWT_SECRET_TEST: ci-jwt-secret-not-for-prod
      FC_RUNS: 25

    steps:
      - uses: actions/checkout@v4

      # No image is published to ghcr — `ccip-postgres` (pg_partman + pg_cron)
      # is built locally, same as the `db-integration` job in ci.yml.
      - name: Build ccip-postgres image
        run: docker build -t ccip-postgres-test ./infra/docker/postgres

      - name: Start postgres container
        run: |
          docker run -d --name pg \
            -e POSTGRES_DB=ccip_test \
            -e POSTGRES_USER=ccip_owner \
            -e POSTGRES_PASSWORD=ccip_dev_pass \
            -p 5432:5432 \
            --health-cmd="pg_isready -U ccip_owner -d ccip_test" \
            --health-interval=5s --health-timeout=5s --health-retries=20 \
            ccip-postgres-test

      - name: Wait for postgres healthy
        run: |
          for i in $(seq 1 30); do
            s=$(docker inspect --format='{{.State.Health.Status}}' pg)
            [ "$s" = "healthy" ] && exit 0
            sleep 2
          done
          docker logs pg
          exit 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @ccip/database db:generate

      - name: Apply migrations to test DB
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
        run: pnpm --filter @ccip/database migrate:deploy

      - name: Run integration tests
        run: pnpm --filter @ccip/api test:integration

      - name: Postgres logs (on failure)
        if: failure()
        run: docker logs pg

      - name: Upload coverage matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-matrix
          path: docs/testing/coverage-matrix.md
