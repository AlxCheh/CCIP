name: Portable Clone Test

on:
  schedule:
    - cron: '0 4 * * *'  # nightly 04:00 UTC
  workflow_dispatch:

jobs:
  random-clone:
    runs-on: ubuntu-latest
    steps:
      - name: Generate random target dir
        id: dir
        run: |
          uuid=$(uuidgen)
          echo "path=/tmp/ccip-$uuid" >> $GITHUB_OUTPUT

      - name: Clone into random dir
        run: |
          git clone "https://github.com/${{ github.repository }}.git" "${{ steps.dir.outputs.path }}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # No actions/checkout in this job (by design — we clone into a
          # random /tmp path to test portability), so GITHUB_WORKSPACE has
          # no package.json for the action's default file-based detection
          # to read (package_json_file must be relative to GITHUB_WORKSPACE
          # per pnpm/action-setup's own contract — an absolute path here
          # silently resolves to nothing → "No pnpm version is specified").
          # Pin the major version instead, matching root package.json's
          # engines.pnpm: ">=9".
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          # No cache: 'pnpm'/cache-dependency-path — actions/setup-node's
          # cache-dependency-path glob is documented only for paths relative
          # to GITHUB_WORKSPACE (always paired with actions/checkout in its
          # own docs); this job has neither by design. A rare nightly
          # portability smoke test doesn't need install caching.

      - name: Install
        working-directory: ${{ steps.dir.outputs.path }}
        run: pnpm install --frozen-lockfile

      - name: Audit suite (must work from random path)
        working-directory: ${{ steps.dir.outputs.path }}
        run: pnpm audit-suite
